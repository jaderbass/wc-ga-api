name: CI

on:
  push:
    branches: [ main, develop, feature/**, fix/**, hotfix/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  php-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.3' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, intl, dom, curl, json, pdo_mysql, sqlite3
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment (.env + sqlite)
        run: |
          cp -n .env.example .env || true
          php -r "file_exists('database') || mkdir('database');"
          php -r "file_exists('database/database.sqlite') || fclose(fopen('database/database.sqlite','w'));"
          php -r "echo "DB_CONNECTION=sqlite\n" . file_get_contents('.env') ;" > .env.tmp
          mv .env.tmp .env
          php artisan key:generate

      - name: Migrate database (SQLite)
        run: php artisan migrate --force

      - name: Run tests (Pest preferred, fallback to PHPUnit)
        run: |
          if [ -f vendor/bin/pest ]; then vendor/bin/pest --colors=always; 
          elif [ -f vendor/bin/phpunit ]; then vendor/bin/phpunit --colors=always; 
          else echo 'No test runner found'; fi

      - name: Pint code style (test mode)
        run: |
          if [ -f vendor/bin/pint ]; then vendor/bin/pint --test; else echo 'Laravel Pint not installed'; fi
